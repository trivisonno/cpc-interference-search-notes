<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAT to Search Notes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        textarea {
            width: 100%;
            height: 100px;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }
        button {
            margin-bottom: 20px;
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
        }
        .cleaned-text {
            margin-top: 20px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        #copyButton {
            margin-left: 10px;
            padding: 5px 10px;
            font-size: 14px;
            cursor: pointer;
        }
        .copy-btn {
            margin-left: 10px;
            padding: 5px 10px;
            font-size: 14px;
            cursor: pointer;
        }
        .species-controls label {
            margin-right: 6px;
        }
        .species-controls input[type="number"] {
            width: 80px;
            margin-right: 20px;
            padding: 4px;
            font-size: 14px;
        }
        .species-group {
            margin-bottom: 20px;
        }
        .species-group h3 {
            margin-bottom: 6px;
        }
        .species-group textarea {
            height: 160px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <h1>CPC Symbols to Interference Search notes</h1>
    <textarea id="inputText" placeholder="Paste or type text here..."></textarea>
    <button id="clearButton">Clear</button>
    <div class="cleaned-text">
        Cleaned Text: <span id="cleanedText"></span>
        <button id="copyButton">Copy</button>
    </div>

    <table id="outputTable">
        <thead>
            <tr>
                <th>US Class/CPC Symbol</th>
                <th>US Subclass/CPC Group</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <p></p>
    <button id="copySpecificTextButton">Copy "Text, inventor, applicant, similarity search tool in pe2e"</button>

    <p></p>
    <h1>Number Range Counter</h1>
  <label for="numberRange">Enter Number Range:</label>
  <input
    type="text"
    id="numberRange"
    placeholder="e.g., 1, 3-5, 6, 7, 10-22"
    oninput="countNumbers()"
  />
  <p id="result">Total Numbers: 0</p>

    <p></p>
    <h1>Species Embodiment List Generator</h1>
    <p>Generates species/embodiment lines in the form <code>Species A1: a first embodiment (Fig. )</code> for N species across M letters.</p>
    <div class="species-controls">
        <label for="speciesCount">Species per letter (N):</label>
        <input type="number" id="speciesCount" min="1" max="1000" value="5" />
        <label for="letterCount">Number of letters (M):</label>
        <input type="number" id="letterCount" min="1" max="100" value="1" />
        <button id="generateSpeciesButton">Generate</button>
        <button id="copyAllSpeciesButton" class="copy-btn">Copy All</button>
    </div>
    <div id="speciesGroups"></div>

    <script>
        const inputText = document.getElementById('inputText');
        const clearButton = document.getElementById('clearButton');
        const tbody = document.querySelector('#outputTable tbody');
        const cleanedTextDiv = document.getElementById('cleanedText');
        const copySpecificTextButton = document.getElementById('copySpecificTextButton');

        function processText() {
            // Get text from textarea
            let text = inputText.value;

            // Define regex to match the pattern
            let regex = /\((.*?)\)\.cpc\./;
            let match = regex.exec(text);

            if (match) {
                let content = match[1]; // Get the content inside the parentheses

                // Split by 'or'/'OR' (case insensitive) and clean up spaces
                let parts = content.split(/ or | OR /i).map(part => part.trim());

                // Use an object to group by the alphabetic part
                let result = {};
                parts.forEach(part => {
                    let alphaPart = part.match(/[A-Z]+\d+[A-Z]?/)[0];
                    let numPart = part.replace(alphaPart, '').trim();

                    if (!result[alphaPart]) {
                        result[alphaPart] = [];
                    }
                    result[alphaPart].push(numPart);
                });

                // Clear previous table rows
                tbody.innerHTML = '';

                // Populate table with new data
                for (let key in result) {
                    let row = document.createElement('tr');
                    let cell1 = document.createElement('td');
                    cell1.textContent = key;

                    let copyBtn1 = document.createElement('button');
                    copyBtn1.textContent = "Copy";
                    copyBtn1.className = 'copy-btn';
                    copyBtn1.addEventListener('click', () => {
                        navigator.clipboard.writeText(key).then(() => {
                            // alert('CPC Symbol copied to clipboard!');
                        }).catch(err => {
                            alert('Failed to copy text: ' + err);
                        });
                    });

                    let cell2 = document.createElement('td');
                    cell2.textContent = result[key].join(' ');

                    let copyBtn2 = document.createElement('button');
                    copyBtn2.textContent = "Copy";
                    copyBtn2.className = 'copy-btn';
                    copyBtn2.addEventListener('click', () => {
                        navigator.clipboard.writeText(result[key].join(' ')).then(() => {
                            // alert('CPC Group copied to clipboard!');
                        }).catch(err => {
                            alert('Failed to copy text: ' + err);
                        });
                    });

                    cell1.appendChild(copyBtn1);
                    cell2.appendChild(copyBtn2);

                    row.appendChild(cell1);
                    row.appendChild(cell2);
                    tbody.appendChild(row);
                }

                // Generate cleaned text
                let cleanedText = parts.join(' ');
                cleanedTextDiv.textContent = cleanedText;
            } else {
                tbody.innerHTML = '<tr><td colspan="2">No valid data found.</td></tr>';
            }
        }

        // Event listener for any change in the textarea
        inputText.addEventListener('input', processText);

        // Clear button functionality
        clearButton.addEventListener('click', () => {
            inputText.value = '';
            tbody.innerHTML = '';
            cleanedTextDiv.textContent = '';
        });

        // Copy button functionality for cleaned text
        const copyButton = document.getElementById('copyButton');
        copyButton.addEventListener('click', () => {
            const textToCopy = cleanedTextDiv.textContent;
            navigator.clipboard.writeText(textToCopy).then(() => {
                // alert('Cleaned text copied to clipboard!');
            }).catch(err => {
                alert('Failed to copy text: ' + err);
            });
        });

        // Copy button functionality for the specific text
        copySpecificTextButton.addEventListener('click', () => {
            const specificText = "Text, inventor, applicant, similarity search tool in pe2e";
            navigator.clipboard.writeText(specificText).then(() => {
                // alert('Specific text copied to clipboard!');
            }).catch(err => {
                alert('Failed to copy specific text: ' + err);
            });
        });

        ////////////////////////////////////////////////////////////////////////////////////
        function countNumbers() {
      const input = document.getElementById("numberRange").value;
      // Split the input, remove any empty entries caused by trailing commas
      const ranges = input.split(/,|\band\b/i).map(range => range.trim()).filter(range => range !== "");
      let count = 0;

      ranges.forEach(range => {
        if (range.includes("-")) {
          // Handle ranges like "3-5"
          const [start, end] = range.split("-").map(Number);
          if (!isNaN(start) && !isNaN(end) && start <= end) {
            count += end - start + 1; // Add the count of numbers in the range
          }
        } else if (!isNaN(Number(range))) {
          // Handle single numbers like "1"
          count += 1;
        }
      });

      // Display result
      document.getElementById("result").innerText = `Total Numbers: ${count}`;
    }

        ////////////////////////////////////////////////////////////////////////////////////
        // Species Embodiment List Generator
        //
        // Produces lines like:
        //   Species A1: a first embodiment (Fig. )
        //   Species A2: a second embodiment (Fig. )
        //   ...
        //   Species AN: an nth embodiment (Fig. )
        // repeated across M letters (A, B, C, ... then AA, AB, ... past 26).

        const onesWords = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'];
        const onesOrdinal = ['', 'first', 'second', 'third', 'fourth', 'fifth', 'sixth', 'seventh', 'eighth', 'ninth'];
        const teenWords = ['ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
        const teenOrdinal = ['tenth', 'eleventh', 'twelfth', 'thirteenth', 'fourteenth', 'fifteenth', 'sixteenth', 'seventeenth', 'eighteenth', 'nineteenth'];
        const tensWords = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
        const tensOrdinal = ['', '', 'twentieth', 'thirtieth', 'fortieth', 'fiftieth', 'sixtieth', 'seventieth', 'eightieth', 'ninetieth'];

        // Cardinal number (in words) for numbers up to the low millions.
        function numberToWords(num) {
            if (num === 0) return 'zero';
            if (num < 10) return onesWords[num];
            if (num < 20) return teenWords[num - 10];
            if (num < 100) {
                const t = Math.floor(num / 10), r = num % 10;
                return tensWords[t] + (r ? '-' + onesWords[r] : '');
            }
            if (num < 1000) {
                const h = Math.floor(num / 100), r = num % 100;
                return onesWords[h] + ' hundred' + (r ? ' ' + numberToWords(r) : '');
            }
            if (num < 1000000) {
                const th = Math.floor(num / 1000), r = num % 1000;
                return numberToWords(th) + ' thousand' + (r ? ' ' + numberToWords(r) : '');
            }
            return String(num);
        }

        // Ordinal number (in words) for numbers up to the low millions; falls
        // back to a numeral-based ordinal (e.g. "1234567th") beyond that.
        function numberToOrdinalWords(num) {
            if (num < 10) return onesOrdinal[num];
            if (num < 20) return teenOrdinal[num - 10];
            if (num < 100) {
                const t = Math.floor(num / 10), r = num % 10;
                return r ? tensWords[t] + '-' + onesOrdinal[r] : tensOrdinal[t];
            }
            if (num < 1000) {
                const h = Math.floor(num / 100), r = num % 100;
                return r ? onesWords[h] + ' hundred ' + numberToOrdinalWords(r) : onesWords[h] + ' hundredth';
            }
            if (num < 1000000) {
                const th = Math.floor(num / 1000), r = num % 1000;
                return r ? numberToWords(th) + ' thousand ' + numberToOrdinalWords(r) : numberToWords(th) + ' thousandth';
            }
            return num + 'th';
        }

        // "a" vs "an" for the given ordinal-word phrase.
        function articleFor(words) {
            const firstWord = words.split(/[\s-]/)[0];
            if (firstWord === 'one') return 'a';
            return /^[aeiou]/i.test(firstWord) ? 'an' : 'a';
        }

        // Spreadsheet-style letter label for a 1-based index: 1 -> A, 26 -> Z, 27 -> AA, ...
        function toLetters(num) {
            let letters = '';
            while (num > 0) {
                const rem = (num - 1) % 26;
                letters = String.fromCharCode(65 + rem) + letters;
                num = Math.floor((num - 1) / 26);
            }
            return letters;
        }

        function buildSpeciesLines(letter, n) {
            const lines = [];
            for (let i = 1; i <= n; i++) {
                const ordinal = numberToOrdinalWords(i);
                const article = articleFor(ordinal);
                lines.push(`Species ${letter}${i}: ${article} ${ordinal} embodiment (Fig. )`);
            }
            return lines;
        }

        const speciesGroupsDiv = document.getElementById('speciesGroups');
        const generateSpeciesButton = document.getElementById('generateSpeciesButton');
        const copyAllSpeciesButton = document.getElementById('copyAllSpeciesButton');

        let allSpeciesText = '';

        function generateSpecies() {
            const n = Math.max(1, parseInt(document.getElementById('speciesCount').value, 10) || 1);
            const m = Math.max(1, parseInt(document.getElementById('letterCount').value, 10) || 1);

            speciesGroupsDiv.innerHTML = '';
            const allGroupsText = [];

            for (let g = 1; g <= m; g++) {
                const letter = toLetters(g);
                const lines = buildSpeciesLines(letter, n);
                const groupText = lines.join('\n');
                allGroupsText.push(groupText);

                const groupDiv = document.createElement('div');
                groupDiv.className = 'species-group';

                const heading = document.createElement('h3');
                heading.textContent = `Group ${letter}`;
                groupDiv.appendChild(heading);

                const textarea = document.createElement('textarea');
                textarea.readOnly = true;
                textarea.value = groupText;
                groupDiv.appendChild(textarea);

                const copyGroupButton = document.createElement('button');
                copyGroupButton.textContent = `Copy Group ${letter}`;
                copyGroupButton.className = 'copy-btn';
                copyGroupButton.addEventListener('click', () => {
                    navigator.clipboard.writeText(groupText).catch(err => {
                        alert('Failed to copy text: ' + err);
                    });
                });
                groupDiv.appendChild(copyGroupButton);

                speciesGroupsDiv.appendChild(groupDiv);
            }

            allSpeciesText = allGroupsText.join('\n\n');
        }

        generateSpeciesButton.addEventListener('click', generateSpecies);

        copyAllSpeciesButton.addEventListener('click', () => {
            if (!allSpeciesText) {
                generateSpecies();
            }
            navigator.clipboard.writeText(allSpeciesText).catch(err => {
                alert('Failed to copy text: ' + err);
            });
        });

        // Generate an initial list on load.
        generateSpecies();
    </script>


</body>
</html>
